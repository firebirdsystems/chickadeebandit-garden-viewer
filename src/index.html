<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Map My Garden</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      var(--hub-bg, #f9fafb);
      --card:    var(--hub-surface, #ffffff);
      --border:  var(--hub-border, #e5e7eb);
      --text:    var(--hub-text, #000000);
      --muted:   var(--hub-text-muted, #6b7280);
      --accent:  var(--hub-primary, #2d6a4f);
      --accent-fg: var(--hub-primary-fg, #ffffff);
      --radius:  var(--hub-radius, 0.5rem);
      --green:   var(--hub-tint-success-fg, #2d6a4f);
      --green-lt: var(--hub-tint-success, #d1fae5);
      /* Backdrop behind photos / floor plans — a soft tint of the accent so
         letterboxed images sit on something warmer than flat black. */
      --photo-bg: linear-gradient(160deg,
                    color-mix(in srgb, var(--accent) 8%, var(--card)),
                    color-mix(in srgb, var(--accent) 18%, var(--card)));
    }

    body {
      font-family: var(--hub-font, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif);
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
      font-size: var(--hub-font-size, 15px);
    }

    /* ── Toolbar ── */
    .toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 16px;
      border-bottom: 1px solid var(--border);
      background: var(--card);
      flex-shrink: 0;
    }
    .garden-select {
      flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 7px 10px; font-size: 0.9rem; background: var(--bg);
      color: var(--text); outline: none; cursor: pointer;
      max-width: 260px;
    }
    .view-tabs { display: flex; gap: 4px; margin-left: auto; }
    .tab-btn {
      padding: 6px 14px; border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--muted); font-size: 0.85rem;
      cursor: pointer; font-weight: 500; transition: all .15s;
    }
    .tab-btn.active {
      background: var(--accent); border-color: var(--accent);
      color: var(--accent-fg);
    }

    /* ── Search ── */
    .search-bar {
      padding: 8px 16px; border-bottom: 1px solid var(--border);
      background: var(--card); flex-shrink: 0;
      display: flex; align-items: center; gap: 8px;
    }
    .search-input {
      flex: 1; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 7px 12px; font-size: 0.9rem; outline: none;
      background: var(--bg); color: var(--text); transition: border-color .15s;
    }
    .search-input:focus { border-color: var(--accent); }
    .add-plant-btn {
      flex-shrink: 0; padding: 7px 13px; border: 1.5px solid var(--accent);
      border-radius: 8px; background: transparent; color: var(--accent);
      font-size: 0.85rem; font-weight: 600; cursor: pointer; font-family: inherit;
      white-space: nowrap; transition: background .12s, color .12s;
    }
    .add-plant-btn:hover { background: var(--accent); color: var(--accent-fg); }

    /* ── Main area ── */
    .main { flex: 1; display: flex; overflow: hidden; position: relative; }

    /* ── Plants list ── */
    .plant-list {
      width: 320px; flex-shrink: 0;
      overflow-y: auto; border-right: 1px solid var(--border);
      background: var(--bg);
    }
    .plant-list.full { width: 100%; border-right: none; }
    .plant-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 16px; border-bottom: 1px solid var(--border);
      cursor: pointer; transition: background .12s; background: var(--card);
    }
    .plant-item:hover { background: var(--bg); }
    .plant-item.selected { background: var(--green-lt); }
    .plant-thumb {
      width: 52px; height: 52px; border-radius: 10px;
      object-fit: cover; flex-shrink: 0; background: var(--border);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; overflow: hidden;
    }
    .plant-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .plant-info { flex: 1; min-width: 0; }
    .plant-name { font-weight: 600; font-size: 0.95rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plant-sci { font-size: 0.78rem; color: var(--muted); font-style: italic; margin-top: 1px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .plant-meta { font-size: 0.78rem; color: var(--muted); margin-top: 3px; }
    .type-badge {
      display: inline-block; font-size: 0.7rem; font-weight: 600;
      padding: 2px 8px; border-radius: 20px;
      background: var(--green-lt); color: var(--green);
      text-transform: capitalize; flex-shrink: 0;
    }

    .empty-state {
      padding: 48px 24px; text-align: center; color: var(--muted);
    }
    .empty-icon { margin-bottom: 12px; }
    .empty-title { font-size: 1.1rem; font-weight: 600; color: var(--text); margin-bottom: 6px; }
    .empty-msg { font-size: 0.875rem; line-height: 1.5; }

    /* ── Detail panel ── */
    .detail-panel {
      flex: 1; overflow-y: auto; background: var(--bg);
    }
    .detail-panel.hidden { display: none; }
    .detail-photos {
      width: 100%; height: 220px; overflow-x: auto;
      display: flex; gap: 4px;
      /* `safe center` keeps a wide strip scrollable instead of clipping its
         left edge; browsers without it simply fall back to left-aligned. */
      justify-content: safe center;
      background: var(--card);
      background: var(--photo-bg);
    }
    .detail-photos img {
      height: 100%; width: auto; object-fit: cover; flex-shrink: 0;
    }
    .detail-photo { position: relative; flex-shrink: 0; height: 100%; }
    .detail-body { padding: 20px 24px; }
    .detail-name { font-size: 1.4rem; font-weight: 700; margin-bottom: 4px; }
    .detail-sci { font-size: 0.95rem; color: var(--muted); font-style: italic; margin-bottom: 12px; }
    .detail-row { margin-bottom: 16px; }
    .detail-label {
      font-size: 0.7rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--muted); margin-bottom: 4px;
    }
    .detail-value { font-size: 0.9rem; color: var(--text); line-height: 1.5; }
    .detail-back {
      display: none; padding: 10px 16px; border-bottom: 1px solid var(--border);
      background: var(--card); cursor: pointer; font-size: 0.875rem;
      color: var(--accent); font-weight: 500;
    }

    /* ── Map view ── */
    #map { flex: 1; }
    .map-view { flex: 1; display: none; position: relative; }
    .map-view.active { display: flex; }

    /* ── Floor plan view ── */
    .floorplan-view {
      flex: 1; display: none; position: relative;
      overflow: hidden; background: #111;
    }
    .floorplan-view.active { display: flex; }
    .floorplan-img { max-width: 100%; max-height: 100%; object-fit: contain; margin: auto; }
    .floorplan-pin {
      position: absolute; transform: translate(-50%, -100%);
      cursor: grab; touch-action: none;
    }
    .floorplan-pin:active { cursor: grabbing; }
    #floorplanContainer.placing { cursor: crosshair; }
    .pin-bubble {
      width: 32px; height: 32px; border-radius: 50%;
      background: var(--accent); display: flex; align-items: center;
      justify-content: center; font-size: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,.3);
      overflow: hidden;
    }
    .pin-bubble img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .pin-tail {
      width: 0; height: 0; margin: -1px auto 0;
      border-left: 6px solid transparent;
      border-right: 6px solid transparent;
      border-top: 10px solid var(--accent);
    }

    /* ── Upload progress ── */
    .upload-bar {
      padding: 10px 20px; background: var(--card);
      border-bottom: 1px solid var(--border); font-size: 0.82rem; color: var(--muted);
    }
    .upload-track { height: 4px; background: var(--border); border-radius: 2px; margin-top: 6px; overflow: hidden; }
    .upload-fill { height: 100%; background: var(--green); border-radius: 2px; transition: width .1s; }

    /* ── Photo strip actions ── */
    .photo-strip-wrap { position: relative; }
    .photo-upload-btn {
      position: absolute; bottom: 8px; right: 8px;
      background: rgba(0,0,0,.6); color: #fff; border: none;
      border-radius: 8px; padding: 6px 12px; font-size: 0.8rem;
      cursor: pointer; font-family: inherit; font-weight: 600;
      backdrop-filter: blur(4px);
    }
    .photo-upload-btn:hover { background: rgba(0,0,0,.8); }
    .photo-del-btn {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,.55); color: #fff; border: none;
      border-radius: 50%; width: 22px; height: 22px; font-size: 0.7rem;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      opacity: 0; transition: opacity .15s, background .15s;
      backdrop-filter: blur(4px);
    }
    .detail-photo:hover .photo-del-btn,
    .photo-del-btn:focus-visible { opacity: 1; }
    .photo-del-btn:hover { background: rgba(220,38,38,.9); }
    /* Touch devices never hover, so the control has to stay reachable. */
    @media (hover: none) { .photo-del-btn { opacity: 1; } }

    /* ── Placement banner ── */
    .placement-banner {
      position: relative; z-index: 20; flex-shrink: 0;
      background: var(--accent); color: var(--accent-fg);
      padding: 9px 16px; display: flex; align-items: center; gap: 10px;
      font-size: 0.875rem; font-weight: 500;
    }
    .placement-banner.hidden { display: none; }
    .placement-banner span { flex: 1; }
    .btn-skip {
      padding: 4px 11px; border: 1.5px solid rgba(255,255,255,.55);
      border-radius: 6px; background: transparent; color: var(--accent-fg);
      font-size: 0.8rem; cursor: pointer; font-family: inherit; font-weight: 600;
    }

    /* ── New Garden / Add Plant modals ── */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
    }
    .modal-backdrop.hidden { display: none; }
    .modal {
      background: var(--card); border-radius: 14px;
      padding: 28px 28px 24px; width: 340px; max-width: calc(100vw - 32px);
      box-shadow: 0 8px 32px rgba(0,0,0,.18);
      max-height: calc(100vh - 48px); overflow-y: auto;
    }
    .modal.modal-lg { width: 420px; }
    .modal textarea {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-size: 0.9rem; background: var(--bg);
      color: var(--text); outline: none; margin-bottom: 16px;
      font-family: inherit; resize: vertical; min-height: 72px;
    }
    .modal textarea:focus { border-color: var(--accent); }
    .modal-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 20px; }
    .modal label { display: block; font-size: 0.75rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin-bottom: 5px; }
    .modal input[type=text], .modal select {
      width: 100%; border: 1.5px solid var(--border); border-radius: 8px;
      padding: 8px 10px; font-size: 0.9rem; background: var(--bg);
      color: var(--text); outline: none; margin-bottom: 16px;
      font-family: inherit;
    }
    .modal input[type=text]:focus, .modal select:focus { border-color: var(--accent); }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .btn-cancel {
      padding: 8px 16px; border: 1.5px solid var(--border); border-radius: 8px;
      background: var(--bg); color: var(--text); font-size: 0.875rem;
      cursor: pointer; font-family: inherit; font-weight: 500;
    }
    .btn-create {
      padding: 8px 18px; border: none; border-radius: 8px;
      background: var(--accent); color: var(--accent-fg); font-size: 0.875rem;
      cursor: pointer; font-family: inherit; font-weight: 600;
    }
    .btn-create:disabled { opacity: .5; cursor: default; }
    .new-garden-btn {
      padding: 6px 12px; border: 1.5px solid var(--accent); border-radius: 8px;
      background: var(--accent); color: var(--accent-fg); font-size: 0.85rem;
      cursor: pointer; font-family: inherit; font-weight: 600; flex-shrink: 0;
    }

    /* ── Loading ── */
    .loading {
      position: absolute; inset: 0; display: flex;
      align-items: center; justify-content: center;
      background: var(--bg); z-index: 10;
    }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent);
      animation: spin .7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .load-error { margin: 0 0 12px; padding: 10px 14px; border-radius: 10px; background: var(--hub-tint-danger, #fee2e2); color: var(--hub-tint-danger-fg, #b91c1c); font-size: 0.9rem; display: flex; gap: 10px; align-items: center; justify-content: space-between; }
    .load-error-retry { background: none; border: 1px solid currentColor; border-radius: 8px; padding: 5px 10px; font: inherit; font-weight: 600; color: inherit; cursor: pointer; flex-shrink: 0; }
    body > .load-error { margin: 12px; }
    .load-error[hidden] { display: none; }

    /* ── Responsive: mobile collapses list when detail is open ── */
    @media (max-width: 600px) {
      .plant-list { width: 100%; border-right: none; }
      .plant-list.with-detail { display: none; }
      .detail-back { display: block; }
      .detail-panel { width: 100%; }
    }
  </style>
<base href="/run/garden-viewer/">
</head>
<body>

<div class="loading" id="loading"><div class="spinner"></div></div>

<!-- Toolbar -->

<!-- Main content -->

<input type="file" id="photo-input" accept="image/jpeg,image/png,image/heic,image/heif,image/webp" style="display:none" />

<div class="upload-bar" id="upload-bar" style="display:none">
  <span id="upload-label">Uploading…</span>
  <div class="upload-track"><div class="upload-fill" id="upload-fill" style="width:0%"></div></div>
</div>

<script type="module">
import { esc, isAdult, createDbHelper, createFilesHelper, hubAlert, hubConfirm, searchMatch, glyph, chickadee } from "/hub-sdk.js";

// The toolbar mark is static markup; the plant fallbacks are also used from
// inline onerror handlers, which can only reach window.
document.getElementById('toolbarGlyph').innerHTML = glyph('sprout');
window.plantGlyph = () => glyph('sprout');
window.plantMarkerGlyph = () => glyph('sprout', { color: '#fff', accent: '#fff' });
import { searchableFields, parsePhotoThumbs, parsePhotoIds, tilePhotoId, photoThumbsFor, hasPosition, failureLine, uploadFailureLine } from "./logic.js";

// ── State ──────────────────────────────────────────────────────────────────

const DB  = window.__DB_URL;
const MEM = window.__CURRENT_MEMBER;
const IS_ADULT = isAdult(MEM);

const dbq   = createDbHelper(DB);
const files = createFilesHelper(window.__FILES_URL ?? "");

let gardens = [];
let plants  = [];
let activeGardenId = null;
let selectedPlantId = null;
let currentView = 'list';
let leafletMap = null;
let leafletMarkers = [];
let placementPlant = null;
let placementMapHandler = null;
let placementFloorHandler = null;

/**
 * Same-origin `src` for a stored hub file id.
 *
 * The columns hold bare file ids, never URLs, on both surfaces — this viewer
 * and the Chickadee Garden companion. That is what lets the app declare them
 * to the hub's reclaim keys, which hand a column's contents straight to the
 * deletion outbox and so cannot accept a URL.
 *
 * It also removes a cross-origin bug the URL form carried: the companion
 * recorded files hub-origin-absolute, this viewer is served from the app's OWN
 * origin, and the app CSP's `img-src 'self'` blocked those absolute URLs. An id
 * resolved through files.url() is same-origin by construction.
 */
function photoSrc(fileId) {
  return fileId ? files.url(fileId) : '';
}

/** `src` for a plant's first photo at thumbnail size: its small copy when the
 *  plant has one recorded, otherwise the photo itself. */
function thumbSrc(plant) {
  return photoSrc(tilePhotoId(plant.photo_file_ids[0], plant.photo_thumbs));
}

/** A plant row as the app holds it: the two JSON columns parsed. */
function readPlant(row) {
  return {
    ...row,
    photo_file_ids: parsePhotoIds(row.photo_file_ids),
    photo_thumbs: parsePhotoThumbs(row.photo_thumbs),
  };
}

// ── Change feed ────────────────────────────────────────────────────────────

/**
 * Tells the Chickadee Garden companion that a garden or plant changed.
 *
 * The companion keeps its own copy of the household's gardens and brings it up
 * to date by reading the `changes` feed, never by re-reading the tables. A row
 * written here without an entry in that feed is one it does not learn about
 * until its next full reload. Rows are appended through the hub's append-record
 * endpoint (manifest `append_only_records.changes`); app SQL cannot write the
 * table.
 *
 * A failed append is logged and not raised: the write it describes has already
 * landed and is correct for everyone using this page.
 */
async function recordChange(entityType, entityId, operation = 'upsert') {
  const base = window.__APPEND_RECORD_URL;
  if (!base) return;
  try {
    const res = await fetch(`${base}/changes`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ entity_type: entityType, entity_id: entityId, operation }),
    });
    if (!res.ok) console.warn('Garden change feed append failed:', res.status);
  } catch (e) {
    console.warn('Garden change feed append failed:', e);
  }
}

/** Runs a member's action and tells them if it fails, instead of leaving the
 *  failure as an unhandled rejection nobody sees. `words` are the action's own
 *  nouns ({ action: "add the photo", thing: "photo" }); the line comes from the
 *  error's status (failureLine, or uploadFailureLine for the upload itself),
 *  never from the hub's text. The error goes to the console. */
function reporting(words, fn) {
  return async (...args) => {
    try {
      return await fn(...args);
    } catch (e) {
      console.error(e);
      await hubAlert(e?.fromUpload ? uploadFailureLine(e, words) : failureLine(e, words));
    }
  };
}

// ── Schema ─────────────────────────────────────────────────────────────────

async function initSchema() {
  // Schema managed by hub migrations
}

// ── Load data ──────────────────────────────────────────────────────────────

// The garden shown on open is the first by name, so its plants are asked for
// beside the garden list rather than after it, naming that garden the same way
// the list orders it. `id` breaks ties so both statements pick the same one.
const FIRST_GARDEN_PLANTS_SQL = 'SELECT * FROM app_garden_viewer__plants WHERE garden_id = (SELECT id FROM app_garden_viewer__gardens ORDER BY name ASC, id ASC LIMIT 1) ORDER BY common_name ASC';

async function loadGardens(withFirstPlants = false, selectId = null) {
  const firstPlants = withFirstPlants ? dbq(FIRST_GARDEN_PLANTS_SQL) : null;
  firstPlants?.catch(() => {});
  const { rows } = await dbq('SELECT * FROM app_garden_viewer__gardens ORDER BY name ASC, id ASC');
  gardens = rows;
  const sel = document.getElementById('gardenSelect');
  sel.innerHTML = '';
  if (!rows.length) {
    sel.innerHTML = '<option>No gardens yet</option>';
    activeGardenId = null;
    plants = [];
    updateControls();
    document.getElementById('plantList').innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${chickadee('nest')}</div>
        <div class="empty-title">No gardens yet</div>
        <div class="empty-msg">${IS_ADULT ? 'Tap + New to create your first garden.' : 'An adult can create the first garden.'}</div>
      </div>`;
    return;
  }
  rows.forEach(g => {
    const opt = document.createElement('option');
    opt.value = g.id;
    opt.textContent = g.name;
    sel.appendChild(opt);
  });
  sel.onchange = reporting({ action: 'open that garden', thing: 'garden' }, () => selectGarden(sel.value));
  // Awaited, so a caller that goes on to use `plants` (the deep link) sees them.
  const target = selectId && rows.some(g => g.id === selectId) ? selectId : rows[0].id;
  await selectGarden(target, target === rows[0].id ? firstPlants : null);
}

/** Controls that depend on who is looking and on there being a garden open. */
function updateControls() {
  document.getElementById('newGardenBtn').style.display = IS_ADULT && !loadFailed ? '' : 'none';
  document.getElementById('addPlantBtn').style.display = IS_ADULT && activeGardenId && !loadFailed ? '' : 'none';
}

// Each call takes the next number; an answer for a garden the member has
// already left is dropped instead of replacing the plants of the one shown.
let gardenLoadSeq = 0;

async function selectGarden(id, plantsRead = null) {
  activeGardenId = id;
  const seq = ++gardenLoadSeq;
  document.getElementById('gardenSelect').value = id;
  closeDetail();
  updateControls();
  // `plantsRead` is the read-ahead for the first garden. It is used only if
  // it answered with rows and every row is this garden's; otherwise the
  // plants are read by id as before. An empty answer names no garden, so it
  // cannot be checked and is not used.
  let rows = null;
  if (plantsRead) {
    const ahead = await plantsRead.catch(() => null);
    if (ahead && ahead.rows.length && ahead.rows.every(p => p.garden_id === id)) rows = ahead.rows;
  }
  rows ??= (await dbq(
    'SELECT * FROM app_garden_viewer__plants WHERE garden_id = ? AND (1=1) ORDER BY common_name ASC',
    [id]
  )).rows;
  if (seq !== gardenLoadSeq) return;
  plants = rows.map(readPlant);
  renderList();
  if (currentView === 'map' || currentView === 'floorplan') renderMap();
  updateMapTabLabel();
}

function updateMapTabLabel() {
  const garden = gardens.find(g => g.id === activeGardenId);
  const isFloor = garden?.garden_type === 'image';
  document.getElementById('tabMap').textContent = isFloor ? 'Plan' : 'Map';
}

// ── List view ──────────────────────────────────────────────────────────────

function renderList() {
  const q = document.getElementById('searchInput').value.trim();
  const filtered = q ? plants.filter(p => searchMatch(q, searchableFields(p))) : [...plants];

  const el = document.getElementById('plantList');
  if (!filtered.length) {
    el.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${chickadee(plants.length ? 'searching' : 'nest')}</div>
        <div class="empty-title">${plants.length ? 'No matches' : 'No plants yet'}</div>
        <div class="empty-msg">${plants.length ? 'Try a different search.' : 'Tap + Add Plant to add your first plant.'}</div>
      </div>`;
    return;
  }

  el.innerHTML = filtered.map(p => {
    const thumb = p.photo_file_ids[0]
      ? `<div class="plant-thumb"><img src="${esc(thumbSrc(p))}" loading="lazy" onerror="this.parentElement.innerHTML=window.plantGlyph()"/></div>`
      : `<div class="plant-thumb">${glyph('sprout')}</div>`;
    const badge = p.plant_type ? `<span class="type-badge">${esc(p.plant_type)}</span>` : '';
    const meta = [p.bed_name, p.added_by_name ? `by ${p.added_by_name}` : ''].filter(Boolean).join(' · ');
    return `<div class="plant-item${p.id === selectedPlantId ? ' selected' : ''}" data-testid="plant-item" data-id="${esc(p.id)}">
      ${thumb}
      <div class="plant-info">
        <div class="plant-name" data-testid="plant-name">${esc(p.common_name)}</div>
        ${p.scientific_name ? `<div class="plant-sci">${esc(p.scientific_name)}</div>` : ''}
        ${meta ? `<div class="plant-meta">${esc(meta)}</div>` : ''}
      </div>
      ${badge}
    </div>`;
  }).join('');
}

// ── Detail panel ───────────────────────────────────────────────────────────

function selectPlant(id) {
  // Update selection highlight without rebuilding the list
  if (selectedPlantId && selectedPlantId !== id) {
    document.querySelector(`.plant-item[data-id="${CSS.escape(selectedPlantId)}"]`)?.classList.remove('selected');
  }
  const p = plants.find(pl => pl.id === id);
  if (!p) { selectedPlantId = null; return; }
  selectedPlantId = id;
  document.querySelector(`.plant-item[data-id="${CSS.escape(id)}"]`)?.classList.add('selected');

  const photoImgs = p.photo_file_ids.map(fid => `
    <div class="detail-photo">
      <img src="${esc(photoSrc(fid))}" onerror="this.parentElement.style.display='none'" style="height:100%;width:auto;object-fit:cover"/>
      ${IS_ADULT ? `<button class="photo-del-btn" data-plant-id="${esc(p.id)}" data-file-id="${esc(encodeURIComponent(fid))}" title="Remove photo" aria-label="Remove photo">${glyph('close', { accent: 'currentColor' })}</button>` : ''}
    </div>`).join('');

  const photos = `
    <div class="photo-strip-wrap">
      <div class="detail-photos" style="${p.photo_file_ids.length === 0 ? 'align-items:center;font-size:3rem;height:180px' : ''}">
        ${p.photo_file_ids.length === 0 ? `<span>${glyph('sprout', { size: '1em' })}</span>` : photoImgs}
      </div>
      ${IS_ADULT ? `<button class="photo-upload-btn" data-plant-id="${esc(p.id)}">+ Add photo</button>` : ''}
    </div>`;

  const coord = (lat, lng) => {
    // null/'' must not become 0 via Number() — an unplaced plant would show a
    // location of 0.00000, 0.00000 (off the coast of Africa).
    if (lat == null || lng == null || lat === '' || lng === '') return '';
    const a = Number(lat), b = Number(lng);
    return Number.isFinite(a) && Number.isFinite(b) ? `${a.toFixed(5)}, ${b.toFixed(5)}` : '';
  };
  const rows = [
    p.scientific_name && row('Scientific Name', `<i>${esc(p.scientific_name)}</i>`),
    p.plant_type      && row('Type', `<span class="type-badge">${esc(p.plant_type)}</span>`),
    p.bed_name        && row('Bed / Zone', esc(p.bed_name)),
    p.notes           && row('Notes', esc(p.notes).replace(/\n/g, '<br>')),
    // SQLite REAL affinity keeps a non-numeric value as TEXT, so any member
    // writing a string into lat/lng made .toFixed throw and blanked the whole
    // detail panel for everyone. Coerce, check, and escape — the raw value is
    // household-writable and would otherwise be interpolated unescaped.
    coord(p.lat, p.lng) && row('Location', esc(coord(p.lat, p.lng))),
    p.added_by_name   && row('Added By', esc(p.added_by_name)),
    row('Date Added', new Date(p.created_at).toLocaleDateString()),
  ].filter(Boolean).join('');

  document.getElementById('detailContent').innerHTML = `
    ${photos}
    <div class="detail-body">
      <div class="detail-name">${esc(p.common_name)}</div>
      ${rows}
    </div>`;

  document.getElementById('detailPanel').classList.remove('hidden');
  document.getElementById('plantList').classList.add('with-detail');
}

function row(label, value) {
  return `<div class="detail-row"><div class="detail-label">${label}</div><div class="detail-value">${value}</div></div>`;
}

function closeDetail() {
  // Remove selection highlight without rebuilding the list
  if (selectedPlantId) {
    document.querySelector(`.plant-item[data-id="${CSS.escape(selectedPlantId)}"]`)?.classList.remove('selected');
  }
  selectedPlantId = null;
  document.getElementById('detailPanel').classList.add('hidden');
  document.getElementById('plantList').classList.remove('with-detail');
}

// ── View switcher ──────────────────────────────────────────────────────────

function setView(v) {
  currentView = v;
  document.getElementById('tabList').classList.toggle('active', v === 'list');
  document.getElementById('tabMap').classList.toggle('active', v === 'map' || v === 'floorplan');
  document.getElementById('searchBar').style.display = v === 'list' ? '' : 'none';

  const listEl      = document.getElementById('plantList');
  const detailEl    = document.getElementById('detailPanel');
  const mapViewEl   = document.getElementById('mapView');
  const floorEl     = document.getElementById('floorplanView');

  listEl.style.display    = v === 'list' ? '' : 'none';
  detailEl.style.display  = v === 'list' ? '' : 'none';
  mapViewEl.classList.toggle('active', false);
  floorEl.classList.toggle('active', false);

  if (v === 'list') return;

  const garden = gardens.find(g => g.id === activeGardenId);
  if (garden?.garden_type === 'image') {
    floorEl.classList.add('active');
    renderFloorPlan(garden);
  } else {
    mapViewEl.classList.add('active');
    renderLeafletMap();
  }
}

function onMapTabClick() {
  const garden = gardens.find(g => g.id === activeGardenId);
  setView(garden?.garden_type === 'image' ? 'floorplan' : 'map');
}

// ── Leaflet map ────────────────────────────────────────────────────────────

function renderLeafletMap() {
  // Only plants with a usable position: a coordinate that is not a number
  // makes Leaflet throw and takes the whole map with it.
  const pinned = plants.filter(hasPosition).map(p => ({ ...p, lat: Number(p.lat), lng: Number(p.lng) }));

  if (!leafletMap) {
    leafletMap = L.map('map');
    // Tiles come from the hub, not straight from OSM. Their tile usage policy
    // disallows both halves of what this used to send — the deprecated {s}
    // sharding subdomains, and a client with no identifying User-Agent, which a
    // browser cannot supply — and every map in the product was being served
    // their "blocked" image instead of a tile. The hub proxy adds the User-Agent
    // and a shared cache in front of the upstream. Root-relative on purpose: the
    // same URL resolves whether this app is framed under /run/:appId on the hub
    // origin or served from its own {appId}.apps.* origin.
    L.tileLayer('/api/tiles/{z}/{x}/{y}', {
      attribution: '© OpenStreetMap contributors', maxZoom: 19,
    }).addTo(leafletMap);
  }

  leafletMarkers.forEach(m => leafletMap.removeLayer(m));
  leafletMarkers = [];

  if (!pinned.length) {
    leafletMap.setView([39.5, -98.35], 4);
    return;
  }

  const bounds = L.latLngBounds(pinned.map(p => [p.lat, p.lng]));
  leafletMap.fitBounds(bounds, { padding: [40, 40] });

  pinned.forEach(p => {
    const icon = L.divIcon({
      className: '',
      html: `<div style="
        width:32px;height:32px;border-radius:50%;
        background:var(--accent,#2d6a4f);
        display:flex;align-items:center;justify-content:center;
        font-size:1.1rem;box-shadow:0 2px 6px rgba(0,0,0,.3);
        overflow:hidden;border:2px solid #fff;
      ">${p.photo_file_ids[0]
        ? `<img src="${esc(thumbSrc(p))}" style="width:100%;height:100%;object-fit:cover;border-radius:50%" onerror="this.outerHTML=window.plantMarkerGlyph()"/>`
        : glyph('sprout', { color: '#fff', accent: '#fff' })
      }</div>`,
      iconSize: [32, 32],
      iconAnchor: [16, 16],
    });
    // Only adults may move a plant; for anyone else the hub refuses the write.
    const marker = L.marker([p.lat, p.lng], { icon, draggable: IS_ADULT })
      .addTo(leafletMap)
      .bindPopup(`<strong>${esc(p.common_name)}</strong>${p.scientific_name ? `<br><i>${esc(p.scientific_name)}</i>` : ''}`);
    marker._plantId = p.id;
    marker.on('click', () => { if (!placementPlant) { setView('list'); selectPlant(p.id); } });
    marker.on('dragend', async () => {
      const ll = marker.getLatLng();
      await savePlantPosition(p.id, ll.lat, ll.lng);
    });
    leafletMarkers.push(marker);
  });
}

function renderMap() {
  if (currentView === 'map') renderLeafletMap();
  if (currentView === 'floorplan') {
    const garden = gardens.find(g => g.id === activeGardenId);
    if (garden) renderFloorPlan(garden);
  }
}

// ── Floor plan view ────────────────────────────────────────────────────────

function renderFloorPlan(garden) {
  const container = document.getElementById('floorplanContainer');
  container.innerHTML = '';

  if (!garden.plan_file_id) {
    container.innerHTML = `
      <div class="empty-state">
        <div class="empty-icon">${chickadee('nest')}</div>
        <div class="empty-title">No floor plan</div>
        <div class="empty-msg">Upload a floor plan image to show where your plants are.</div>
        ${IS_ADULT ? `<button class="plan-upload-trigger" data-garden-id="${esc(garden.id)}"
          style="margin-top:16px;padding:8px 16px;background:var(--accent);color:var(--accent-fg);border:none;border-radius:8px;cursor:pointer;font-size:.875rem;font-weight:600">
          Upload floor plan
        </button>` : ''}
      </div>`;
    return;
  }

  const img = document.createElement('img');
  img.src = photoSrc(garden.plan_file_id);
  img.className = 'floorplan-img';
  img.id = 'floorplanImg';
  container.appendChild(img);

  if (IS_ADULT) {
    const replaceBtn = document.createElement('button');
    replaceBtn.className = 'photo-upload-btn';
    replaceBtn.textContent = '↺ Replace floor plan';
    replaceBtn.onclick = () => triggerPlanUpload(garden.id);
    container.appendChild(replaceBtn);
  }

  img.onload = () => {
    const pinned = plants.filter(hasPosition);
    pinned.forEach(p => {
      const pin = document.createElement('div');
      pin.className = 'floorplan-pin';
      pin.dataset.plantId = p.id;
      pin.style.left = `${Number(p.lng) * 100}%`;
      pin.style.top  = `${Number(p.lat) * 100}%`;
      if (!IS_ADULT) pin.style.cursor = 'pointer';
      pin.innerHTML = `
        <div class="pin-bubble">${p.photo_file_ids[0]
          ? `<img src="${esc(thumbSrc(p))}" onerror="this.outerHTML=window.plantGlyph()"/>`
          : glyph('sprout')}</div>
        <div class="pin-tail"></div>`;
      pin.title = p.common_name;
      makePinDraggable(pin, p.id, container);
      container.appendChild(pin);
    });

    // Placement-mode click on floor plan
    if (placementPlant && !placementFloorHandler) {
      placementFloorHandler = (e) => {
        if (e.target.closest('.floorplan-pin') || e.target.closest('button')) return;
        const rect = container.getBoundingClientRect();
        const lat = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        const lng = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        savePlantPosition(placementPlant.id, lat, lng);
        exitPlacementMode();
      };
      container.addEventListener('click', placementFloorHandler);
    }
  };
}

document.getElementById('tabList').onclick = () => setView('list');
document.getElementById('tabMap').onclick = onMapTabClick;
let _searchTimer;
document.getElementById('searchInput').addEventListener('input', () => {
  clearTimeout(_searchTimer);

});

// Expose functions needed by dynamically-rendered innerHTML onclick handlers
window.selectPlant  = selectPlant;
window.closeDetail  = closeDetail;
window.setView      = setView;

// Delegated click handlers — row ids are attacker-controllable (any adult can
// INSERT a plant/garden with a crafted id via raw /api/db), so we never
// interpolate them into inline onclick JS-string contexts. data-* attributes
// (esc()'d) + event delegation keep ids out of any executable context.
document.getElementById('plantList').addEventListener('click', (e) => {

document.getElementById('floorplanContainer').addEventListener('click', (e) => {
  const b = e.target.closest('.plan-upload-trigger');
  if (b) window.triggerPlanUpload(b.dataset.gardenId);
});

// ── Photo / floor-plan upload ──────────────────────────────────────────────

async function uploadWithProgress(file, label, options = {}) {
  const bar   = document.getElementById('upload-bar');
  const fill  = document.getElementById('upload-fill');
  const lbl   = document.getElementById('upload-label');
  bar.style.display = '';
  lbl.textContent   = `Uploading ${label}…`;
  fill.style.width  = '0%';

  try {
    const result = await files.upload(file, {
      ...options,
      onProgress: (e) => {
        if (e.lengthComputable) {
          fill.style.width = `${Math.round(e.loaded / e.total * 100)}%`;
        }
      },
    });
    return result; // { id, url, thumbnailId? }
  } catch (e) {
    // The upload's own refusals (too large, wrong type) have lines of their own.
    if (e && typeof e === 'object') e.fromUpload = true;
    throw e;
  } finally {
    bar.style.display = 'none';
  }
}

async function addPhotoToPlant(plant, file) {
  // Ask for a small copy as well: the list and the map pins draw that. The
  // reply has no `thumbnailId` when none was kept, and the photo then has no
  // entry in `photo_thumbs`.
  const result = await uploadWithProgress(file, file.name, { thumbnail: true });
  const updated = [...plant.photo_file_ids, result.id];
  const newThumbs = result.thumbnailId ? { [result.id]: result.thumbnailId } : {};
  // No row has taken a reference to these bytes yet, and nothing sweeps
  // unreferenced files — an upload abandoned here would count against the
  // household's storage quota permanently, invisible to everyone. Undo it
  // whether the write was turned away or failed outright.
  let written = false;
  try {
    written = await writePhotoUrls(plant, updated, newThumbs);
  } finally {
    if (!written) await files.delete(result.id).catch(() => {});
  }
  if (!written) return;
  await recordChange('plants', plant.id);
  // Redraw the plant only if the member is still looking at it.
  if (selectedPlantId === plant.id) selectPlant(plant.id);
  renderList();
}

/**
 * Writes a plant's photo list under an optimistic-concurrency guard, using the
 * `version` column that has been in the schema since 001_init and was never
 * read.
 *
 * `photo_file_ids` is a JSON array edited by read-modify-write, so two members
 * adding photos at the same time each wrote back a list built from what they
 * loaded — and the second write silently erased the first one's photo, leaving
 * an uploaded file with nothing referencing it. The version check turns that
 * into a retry: the UPDATE only lands on the row version the caller read, and
 * a mismatch reloads and re-applies the edit to the current list.
 *
 * `photo_thumbs` is written by the same statement, holding the small copies of
 * the photos in the list being written and no others. `newThumbs` names the
 * small copies of photos this edit adds.
 *
 * Returns false if the write could not be completed, having already told the
 * member why.
 */
const PHOTO_WRITE_ATTEMPTS = 3;
async function writePhotoUrls(plant, nextUrls, newThumbs = {}) {
  let desired = nextUrls;
  let current = plant;
  let thumbs = { ...plant.photo_thumbs, ...newThumbs };
  for (let attempt = 0; attempt < PHOTO_WRITE_ATTEMPTS; attempt++) {
    const desiredThumbs = photoThumbsFor(desired, thumbs);
    const { changed } = await dbq(
      `UPDATE app_garden_viewer__plants SET photo_file_ids = ?, photo_thumbs = ?, updated_at = ?, version = version + 1
        WHERE id = ? AND version = ?`,
      [JSON.stringify(desired), JSON.stringify(desiredThumbs), new Date().toISOString(), current.id, current.version],
    );
    if (changed) {
      plant.photo_file_ids = desired;
      plant.photo_thumbs = desiredThumbs;
      plant.version = Number(current.version) + 1;
      return true;
    }
    // Somebody else wrote first. Re-read, then re-apply this edit — as a set
    // difference, so a concurrent addition survives instead of being clobbered.
    const { rows } = await dbq(`SELECT * FROM app_garden_viewer__plants WHERE id = ?`, [current.id]);
    if (!rows?.[0]) {
      await hubAlert('This plant was removed while you were editing it.');
      return false;
    }
    const fresh = readPlant(rows[0]);
    const removed = new Set(current.photo_file_ids.filter(u => !desired.includes(u)));
    const added = desired.filter(u => !current.photo_file_ids.includes(u));
    desired = [...fresh.photo_file_ids.filter(u => !removed.has(u)), ...added];
    thumbs = { ...fresh.photo_thumbs, ...newThumbs };
    current = fresh;
  }
  await hubAlert('Someone else is editing this plant’s photos. Try again in a moment.');
  return false;
}

async function removePhotoFromPlant(plant, fileId) {
  if (!await hubConfirm({ message: 'Remove this photo?', confirmLabel: 'Remove', destructive: true })) return;
  // Unlink only. `manifest.update_file_list_columns` has the hub read the
  // pre-image of photo_file_ids, queue whatever the new value drops, and let
  // the deletion outbox re-check references against the COMMITTED database
  // before touching R2 — so a file some other plant also names survives.
  //
  // This replaces an ordering compromise. Deleting the bytes first left a
  // dangling reference when the write failed; deleting them second left an
  // orphan when the delete was lost, and nothing sweeps unreferenced files.
  // Neither is reachable now: one statement decides both.
  const updated = plant.photo_file_ids.filter(id => id !== fileId);
  if (!await writePhotoUrls(plant, updated)) return;
  await recordChange('plants', plant.id);
  if (selectedPlantId === plant.id) selectPlant(plant.id);
  renderList();
}

async function uploadFloorPlan(garden, file) {
  // No small copy: the plan is drawn large, from the file itself.
  const result = await uploadWithProgress(file, 'floor plan');
  const previous = garden.plan_file_id;
  // Point the garden at the new plan before discarding the old one, for the
  // same reason as photos above: a failed write used to leave the garden
  // referencing a plan whose bytes had already been deleted.
  //
  // The write is not guaranteed to land — the garden may have been deleted
  // from another device mid-upload — so both failure paths delete the freshly
  // uploaded bytes. Nothing else ever would: no row names them.
  let changed;
  try {
    // `version` moves with every write: the companion app writes this row
    // only at the version it last read.
    ({ changed } = await dbq(
      `UPDATE app_garden_viewer__gardens SET plan_file_id = ?, updated_at = ?, version = version + 1 WHERE id = ?`,
      [result.id, new Date().toISOString(), garden.id]));
  } catch (e) {
    await files.delete(result.id).catch(() => {});
    throw e;
  }
  if (!changed) {
    await files.delete(result.id).catch(() => {});
    await hubAlert('This garden was removed while the floor plan was uploading.');
    return;
  }
  garden.plan_file_id = result.id;
  await recordChange('gardens', garden.id);
  // The replaced plan is the hub's to reclaim: `manifest.update_file_columns`
  // read plan_file_id's pre-image as part of the UPDATE above. Nothing to do
  // here, and nothing left to lose if this tab goes away.
  void previous;
  renderFloorPlan(garden);
}

// ── Wire file inputs ───────────────────────────────────────────────────────

let _uploadTargetPlant  = null;
let _uploadTargetGarden = null;

document.getElementById('photo-input').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  e.target.value = '';
  const plant = _uploadTargetPlant;
  _uploadTargetPlant = null;
  if (file && plant) await reporting({ action: 'add the photo', thing: 'photo' }, addPhotoToPlant)(plant, file);
});

document.getElementById('plan-input').addEventListener('change', async (e) => {
  const file = e.target.files?.[0];
  e.target.value = '';
  const garden = _uploadTargetGarden;
  _uploadTargetGarden = null;
  if (file && garden) await reporting({ action: 'upload the floor plan', thing: 'floor plan' }, uploadFloorPlan)(garden, file);
});

window.triggerPhotoUpload = (plantId) => {
  _uploadTargetPlant = plants.find(p => p.id === plantId) ?? null;
  if (_uploadTargetPlant) document.getElementById('photo-input').click();
};

window.triggerPlanUpload = (gardenId) => {
  _uploadTargetGarden = gardens.find(g => g.id === gardenId) ?? null;
  if (_uploadTargetGarden) document.getElementById('plan-input').click();
};

window.removePhoto = (plantId, fileId) => {
  const plant = plants.find(p => p.id === plantId);
  if (plant) reporting({ action: 'remove the photo', thing: 'photo' }, removePhotoFromPlant)(plant, decodeURIComponent(fileId));
};

// ── Draggable floor plan pins ──────────────────────────────────────────────

function makePinDraggable(pin, plantId, container) {
  let startX, startY, startLng, startLat, didDrag = false;

  pin.addEventListener('pointerdown', (e) => {
    // Only adults may move a plant. Without the capture taken below, the move
    // and release handlers do nothing and the click still opens the plant.
    if (!IS_ADULT) return;
    e.stopPropagation();
    e.preventDefault();
    pin.setPointerCapture(e.pointerId);
    const rect = container.getBoundingClientRect();
    startX   = e.clientX;
    startY   = e.clientY;
    startLng = parseFloat(pin.style.left) / 100;
    startLat = parseFloat(pin.style.top)  / 100;
    didDrag  = false;
  });

  pin.addEventListener('pointermove', (e) => {
    if (!pin.hasPointerCapture(e.pointerId)) return;
    const rect = container.getBoundingClientRect();
    const dx = (e.clientX - startX) / rect.width;
    const dy = (e.clientY - startY) / rect.height;
    if (Math.abs(dx) > 0.003 || Math.abs(dy) > 0.003) didDrag = true;
    pin.style.left = `${Math.max(0, Math.min(1, startLng + dx)) * 100}%`;
    pin.style.top  = `${Math.max(0, Math.min(1, startLat + dy)) * 100}%`;
  });

  pin.addEventListener('pointerup', async (e) => {
    if (!pin.hasPointerCapture(e.pointerId)) return;
    pin.releasePointerCapture(e.pointerId);
    if (didDrag) {
      const lng = parseFloat(pin.style.left) / 100;
      const lat = parseFloat(pin.style.top)  / 100;
      await savePlantPosition(plantId, lat, lng);
    }
  });

  pin.addEventListener('click', (e) => {
    if (didDrag) { e.stopPropagation(); didDrag = false; return; }
    if (placementPlant) return; // placement mode handles the click
    setView('list');
    selectPlant(plantId);
  });
}

// ── Save plant position ────────────────────────────────────────────────────

async function savePlantPosition(plantId, lat, lng) {
  try {
    // `version` moves with every write: the companion app and the photo
    // writes above both write this row only at the version they last read.
    const { changed } = await dbq(
      'UPDATE app_garden_viewer__plants SET lat = ?, lng = ?, updated_at = ?, version = version + 1 WHERE id = ?',
      [lat, lng, new Date().toISOString(), plantId]);
    if (!changed) throw Object.assign(new Error('this plant is no longer in the garden.'), { forUser: true });
  } catch (e) {
    // The pin or marker has already been drawn where it was dropped. Put
    // everything back where the garden actually has it.
    renderMap();
    if (!e?.forUser) console.error(e);
    await hubAlert(e?.forUser ? `Couldn’t move the plant: ${e.message}` : failureLine(e, { action: 'move the plant', thing: 'plant' }));
    return;
  }
  const p = plants.find(pl => pl.id === plantId);
  if (p) { p.lat = lat; p.lng = lng; p.version = Number(p.version) + 1; }
  await recordChange('plants', plantId);

  // Update only the moved element rather than rebuilding all markers/pins
  if (currentView === 'map') {
    const marker = leafletMarkers.find(m => m._plantId === plantId);
    if (marker) marker.setLatLng([lat, lng]);
    else renderLeafletMap();
  } else if (currentView === 'floorplan') {
    const pin = document.querySelector(`.floorplan-pin[data-plant-id="${CSS.escape(plantId)}"]`);
    if (pin) { pin.style.left = `${lng * 100}%`; pin.style.top = `${lat * 100}%`; }
    else renderMap();
  }
}

// ── Placement mode ─────────────────────────────────────────────────────────

function enterPlacementMode(plant) {
  placementPlant = plant;
  const garden = gardens.find(g => g.id === activeGardenId);
  const isFloor = garden?.garden_type === 'image';

  document.getElementById('placementPlantName').textContent = plant.common_name;
  document.getElementById('placementViewLabel').textContent = isFloor ? 'floor plan' : 'map';
  document.getElementById('placementBanner').classList.remove('hidden');

  if (isFloor) {
    setView('floorplan');
    const container = document.getElementById('floorplanContainer');
    container.classList.add('placing');
    // placementFloorHandler is attached inside renderFloorPlan's img.onload
    // (or immediately if the image was already loaded / no image)
    if (!container.querySelector('img') || container.querySelector('img')?.complete) {
      placementFloorHandler = (e) => {
        if (e.target.closest('.floorplan-pin') || e.target.closest('button')) return;
        const rect = container.getBoundingClientRect();
        const lat = Math.max(0, Math.min(1, (e.clientY - rect.top) / rect.height));
        const lng = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
        savePlantPosition(plant.id, lat, lng);
        exitPlacementMode();
      };
      container.addEventListener('click', placementFloorHandler);
    }
  } else {
    setView('map');
    placementMapHandler = (e) => {
      const { lat, lng } = e.latlng;
      savePlantPosition(plant.id, lat, lng);
      exitPlacementMode();
    };
    leafletMap.once('click', placementMapHandler);
  }
}

window.exitPlacementMode = () => {
  if (!placementPlant) return;
  placementPlant = null;
  document.getElementById('placementBanner').classList.add('hidden');

  const container = document.getElementById('floorplanContainer');
  container.classList.remove('placing');
  if (placementFloorHandler) {
    container.removeEventListener('click', placementFloorHandler);
    placementFloorHandler = null;
  }
  if (placementMapHandler && leafletMap) {
    leafletMap.off('click', placementMapHandler);
    placementMapHandler = null;
  }
};

// ── Add plant ──────────────────────────────────────────────────────────────

window.openAddPlantModal = () => {
  if (!activeGardenId) return;
  ['plantNameInput','plantSciInput','plantTypeInput','plantBedInput','plantNotesInput']
    .forEach(id => { document.getElementById(id).value = ''; });
  document.getElementById('addPlantSubmitBtn').disabled = true;
  document.getElementById('addPlantModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('plantNameInput').focus(), 50);
};

window.closeAddPlantModal = () => {
  document.getElementById('addPlantModal').classList.add('hidden');
};

document.getElementById('plantNameInput').addEventListener('input', () => {
  document.getElementById('addPlantSubmitBtn').disabled =
    !document.getElementById('plantNameInput').value.trim();
});

document.getElementById('addPlantModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) window.closeAddPlantModal();
});

window.submitAddPlant = reporting({ action: 'add the plant', thing: 'plant' }, async () => {
  const name = document.getElementById('plantNameInput').value.trim();
  const submit = document.getElementById('addPlantSubmitBtn');
  // The button is off while the write is in flight, so a second tap does not
  // add the plant twice.
  if (!name || !activeGardenId || submit.disabled) return;
  submit.disabled = true;

  const id  = crypto.randomUUID();
  const gardenId = activeGardenId;
  const now = new Date().toISOString();
  try {
    await dbq(
      `INSERT INTO app_garden_viewer__plants
       (id, garden_id, common_name, scientific_name, plant_type, bed_name, notes,
        photo_file_ids, photo_thumbs, lat, lng, added_by_id, added_by_name, created_at, updated_at)
       VALUES (?, ?, ?, ?, ?, ?, ?, '[]', '{}', NULL, NULL, ?, ?, ?, ?)`,
      [
        id, gardenId, name,
        document.getElementById('plantSciInput').value.trim()  || null,
        document.getElementById('plantTypeInput').value.trim() || null,
        document.getElementById('plantBedInput').value.trim()  || null,
        document.getElementById('plantNotesInput').value.trim()|| null,
        MEM?.id ?? null, MEM?.name ?? null, now, now,
      ]
    );
  } catch (e) {
    submit.disabled = false;
    throw e;
  }
  await recordChange('plants', id);

  window.closeAddPlantModal();
  if (activeGardenId !== gardenId) return;

  const { rows } = await dbq(
    'SELECT * FROM app_garden_viewer__plants WHERE garden_id = ? ORDER BY common_name ASC', [gardenId]);
  if (activeGardenId !== gardenId) return;
  plants = rows.map(readPlant);
  renderList();

  const newPlant = plants.find(p => p.id === id);
  if (newPlant) enterPlacementMode(newPlant);
});

// ── New garden ─────────────────────────────────────────────────────────────

window.openNewGardenModal = () => {
  document.getElementById('gardenNameInput').value = '';
  document.getElementById('gardenTypeInput').value = 'map';
  document.getElementById('createGardenBtn').disabled = true;
  document.getElementById('newGardenModal').classList.remove('hidden');
  setTimeout(() => document.getElementById('gardenNameInput').focus(), 50);
};

window.closeNewGardenModal = () => {
  document.getElementById('newGardenModal').classList.add('hidden');
};

window.updateCreateBtn = () => {
  const name = document.getElementById('gardenNameInput').value.trim();
  document.getElementById('createGardenBtn').disabled = name.length === 0;
};

window.createGarden = reporting({ action: 'create the garden', thing: 'garden' }, async () => {
  const name = document.getElementById('gardenNameInput').value.trim();
  const gardenType = document.getElementById('gardenTypeInput').value;
  const create = document.getElementById('createGardenBtn');
  if (!name || create.disabled) return;
  create.disabled = true;

  const id = crypto.randomUUID();
  const now = new Date().toISOString();
  try {
    await dbq(
      'INSERT INTO app_garden_viewer__gardens (id, name, garden_type, plan_file_id, created_at) VALUES (?, ?, ?, NULL, ?)',
      [id, name, gardenType, now]
    );
  } catch (e) {
    create.disabled = false;
    throw e;
  }
  await recordChange('gardens', id);

  closeNewGardenModal();
  // One load that opens the new garden. Loading the list and then selecting
  // started two plant reads at once, and the first garden's could land last.
  await loadGardens(false, id);
});

// Close modal on backdrop click
document.getElementById('newGardenModal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeNewGardenModal();
});

// Close modals / exit placement on Escape
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  if (!document.getElementById('newGardenModal').classList.contains('hidden')) {
    closeNewGardenModal();
  } else if (!document.getElementById('addPlantModal').classList.contains('hidden')) {
    window.closeAddPlantModal();
  } else {
    window.exitPlacementMode();
  }
});

// ── Deep link ──────────────────────────────────────────────────────────────

async function handleDeepLink() {
  const plantId = new URLSearchParams(window.location.search).get("plantId");
  if (!plantId) return;
  // The plant may be in a garden other than the one opened first.
  if (!plants.some(p => p.id === plantId)) {
    const { rows } = await dbq('SELECT garden_id FROM app_garden_viewer__plants WHERE id = ?', [plantId]);
    const gardenId = rows?.[0]?.garden_id;
    if (!gardenId || !gardens.some(g => g.id === gardenId)) return;
    await selectGarden(gardenId);
  }
  selectPlant(plantId);
}

// ── Boot ───────────────────────────────────────────────────────────────────

// True from a failed first load until a load succeeds. While it is, the page
// lists no gardens or plants and offers no way to add one.
let loadFailed = false;

async function init() {
  try {
    await initSchema();
    await loadGardens(true);
    await handleDeepLink();
    loadFailed = false;
  } catch (e) {
    console.error('Garden viewer init failed:', e);
    loadFailed = true;
    gardenLoadSeq++;
    gardens = [];
    plants = [];
    activeGardenId = null;
    document.getElementById('gardenSelect').innerHTML = '';
    document.getElementById('plantList').innerHTML = '';
  } finally {
    document.getElementById('loading').style.display = 'none';
    // Say so on the page: the console is not somewhere a member looks.
    document.getElementById('loadError').hidden = !loadFailed;
    updateControls();
  }
}

document.querySelector('[data-testid="load-retry"]').addEventListener('click', () => {
  document.getElementById('loading').style.display = '';
  init();
});

init();
</script>
